<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Schedule</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
  <header class="flex justify-between items-center p-6 bg-white shadow-md">
    <div class="text-2xl font-bold text-blue-900">FOOTYTV</div>
    <nav class="flex space-x-6 text-sm font-medium">
      <a href="index.html" class="hover:text-blue-600">Home</a>
      <a href="aboutus.html" class="hover:text-blue-600">About Us</a>
      <a href="facilities.html" class="hover:text-blue-600">Facilities</a>
      <a href="#" class="text-blue-600 underline">Schedule</a>
       <a href="contact.html" class="hover:text-blue-600">Contact</a>
    </nav>
    <a href="booking.html" class="bg-gradient-to-r from-blue-400 to-blue-600 text-white px-4 py-2 rounded-full text-sm">BOOK WITH US</a>
  </header>

<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-lg p-6">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800 flex items-center justify-center gap-2">
      <i class="w-6 h-6 text-blue-600"></i> Football Match Schedule
    </h1>

    <div class="space-y-4 mt-30">
      <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg shadow-sm">
        <div class="flex items-center gap-4">
          <i data-lucide="shield" class="w-5 h-5 text-red-600"></i>
          <span class="font-semibold">Arsenal</span>
          <span class="text-sm text-gray-500">vs</span>
          <span class="font-semibold">Chelsea</span>
          <i data-lucide="shield" class="w-5 h-5 text-blue-600"></i>
        </div>
        <div class="flex items-center gap-2 text-gray-600">
          <i class="w-4 h-4"></i>
          <span>3:00 PM</span>
        </div>
        <div class="flex items-center gap-2 text-gray-600">
          <i class="w-4 h-4"></i>
          <span>Emirates Stadium</span>
        </div>
      </div>

      <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg shadow-sm">
        <div class="flex items-center gap-4">
          <i data-lucide="shield" class="w-5 h-5 text-yellow-500"></i>
          <span class="font-semibold">Man united</span>
          <span class="text-sm text-gray-500">vs</span>
          <span class="font-semibold">liverpool</span>
          <i data-lucide="shield" class="w-5 h-5 text-white bg-black rounded-full"></i>
        </div>
        <div class="flex items-center gap-2 text-gray-600">
          <i class="w-4 h-4"></i>
          <span>6:00 PM</span>
        </div>
        <div class="flex items-center gap-2 text-gray-600">
          <i class="w-4 h-4"></i>
          <span>old-trafford</span>
        </div>
      </div>

      <!-- Add more matches here -->
        <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg shadow-sm">
        <div class="flex items-center gap-4">
          <i data-lucide="shield" class="w-5 h-5 text-yellow-500"></i>
          <span class="font-semibold">Evertone</span>
          <span class="text-sm text-gray-500">vs</span>
          <span class="font-semibold">brentford</span>
          <i data-lucide="shield" class="w-5 h-5 text-white bg-black rounded-full"></i>
        </div>
        <div class="flex items-center gap-2 text-gray-600">
          <i class="w-4 h-4"></i>
          <span>1:00 PM</span>
        </div>
        <div class="flex items-center gap-2 text-gray-600">
          <i class="w-4 h-4"></i>
          <span>Hill Dickinson Stadium</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
